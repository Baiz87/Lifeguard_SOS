workflows:
  ios-workflow:
    name: iOS Workflow
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
    scripts:
      - name: Get Flutter packages
        script: flutter packages pub get
      - name: Build ipa
        script: flutter build ipa --release --no-codesign
    artifacts:
      - build/ios/ipa/*.ipa